name: PR lint

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The prefix picks the version bump at release time, so the check runs the
      # release's own vocabulary — bumpByPrefix in cmd/next-version/main.go —
      # rather than a second copy of it in this file. An unprefixed title is not
      # a style problem: it costs the release its minor bump, which is how
      # v1.27.4, v1.28.1 and v1.28.3 each shipped a feature under a patch tag.
      #
      # The title goes through the environment, never interpolated into the
      # script: it is attacker-controlled text on a fork's pull request, and
      # ${{ }} would splice it into the shell.
      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: go run ./cmd/next-version -check-title="$PR_TITLE"
