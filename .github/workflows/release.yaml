name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: auto derives it from the changes since the last tag"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Report the version that would be released, without tagging or releasing"
        type: boolean
        default: false

env:
  GO_VERSION: "1.26.x"

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # version resolves the tag every other job releases, from either entry point:
  # a tag pushed by hand, or a dispatch that computes the next semantic version
  # and creates the tag itself. The dispatch path cannot hand off to the push
  # path — a tag created with GITHUB_TOKEN does not trigger `on: push: tags` —
  # so the jobs below run off this job's outputs instead of the ref.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version || steps.compute.outputs.version }}
      previous_tag: ${{ steps.tag.outputs.previous_tag || steps.compute.outputs.previous_tag }}
      sha: ${{ github.sha }}
      release: ${{ steps.tag.outputs.release || steps.compute.outputs.release }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Guard the release ref
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "::error::Releases are cut from ${DEFAULT_BRANCH}; this run is on ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Version from tag
        id: tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          version="${GITHUB_REF#refs/tags/}"
          previous="$(git tag --sort=-version:refname | grep -A1 "^${version}$" | tail -n1 || echo "")"
          if [ "$previous" = "$version" ]; then
            previous=""
          fi

          {
            echo "version=$version"
            echo "previous_tag=$previous"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Compute version
        id: compute
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Appends version, previous_tag, bump and unclassified to
          # $GITHUB_OUTPUT, and a per-change table to the run summary. A change
          # whose title carries no known prefix counts as a patch and is
          # flagged there, so an under-versioned release is visible.
          go run ./cmd/next-version -bump="$BUMP"

          if [ "$DRY_RUN" = "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: github.event_name == 'workflow_dispatch' && steps.compute.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.compute.outputs.version }}
        run: |
          set -euo pipefail

          # Annotated, so the tag records who cut the release and when.
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${VERSION}" \
            -f message="${VERSION}" \
            -f object="${GITHUB_SHA}" \
            -f type=commit \
            --jq '.sha')"

          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${VERSION}" \
            -f sha="${tag_sha}"

          echo "::notice::Tagged ${VERSION} at ${GITHUB_SHA}"

  release-image:
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.release == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker context create builders

      - uses: docker/setup-buildx-action@v4
        with:
          version: latest
          endpoint: builders

      - name: Image Release
        run: make push-stdio VERSION=${{ needs.version.outputs.version }}

  build-binaries:
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.release == 'true'

    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go Build
        run: |
          mkdir -p releases
          version="${{ needs.version.outputs.version }}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-X 'github.com/teamwork/mcp/internal/config.Version=$version'" -o releases/tw-mcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/mcp-stdio

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcp-binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: releases/tw-mcp-${{ matrix.goos }}-${{ matrix.goarch }}

  release-binaries:
    runs-on: ubuntu-latest
    needs: ["version", "build-binaries"]
    if: needs.version.outputs.release == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}

      - name: Download all binaries artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mcp-binaries-*
          path: releases
          merge-multiple: true

      - name: Package release archives and checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          version="$VERSION"
          version_no_v="${version#v}"
          dist_dir="releases/dist"

          mkdir -p "$dist_dir"

          for bin in releases/tw-mcp-*; do
            name="$(basename "$bin")"
            target="${name#tw-mcp-}"
            goos="${target%-*}"
            goarch="${target##*-}"

            if [ "$goos" = "windows" ]; then
              cp "$bin" "$dist_dir/tw-mcp.exe"
              (cd "$dist_dir" && zip -q "tw-mcp_${version_no_v}_${goos}_${goarch}.zip" tw-mcp.exe)
              rm -f "$dist_dir/tw-mcp.exe"
            else
              cp "$bin" "$dist_dir/tw-mcp"
              (cd "$dist_dir" && tar -czf "tw-mcp_${version_no_v}_${goos}_${goarch}.tar.gz" tw-mcp)
              rm -f "$dist_dir/tw-mcp"
            fi
          done

          (cd "$dist_dir" && sha256sum tw-mcp_* > checksums.txt)

      - name: Create Release
        run: |
          version="${{ needs.version.outputs.version }}"
          gh release create $version \
            --fail-on-no-commits \
            --generate-notes \
            ${{ needs.version.outputs.previous_tag != '' && format('--notes-start-tag {0}', needs.version.outputs.previous_tag) || '' }} \
            --verify-tag \
            releases/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew:
    runs-on: ubuntu-latest
    needs: ["version", "release-binaries"]
    if: needs.version.outputs.release == 'true'

    steps:
      - name: Version
        id: version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Download darwin release archives
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ steps.version.outputs.version }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "tw-mcp_${{ steps.version.outputs.version_no_v }}_darwin_*.tar.gz" \
            --dir dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Homebrew checksums
        id: checksums
        run: |
          set -euo pipefail
          amd64_archive="dist/tw-mcp_${{ steps.version.outputs.version_no_v }}_darwin_amd64.tar.gz"
          arm64_archive="dist/tw-mcp_${{ steps.version.outputs.version_no_v }}_darwin_arm64.tar.gz"

          sha_amd64="$(sha256sum "$amd64_archive" | awk '{print $1}')"
          sha_arm64="$(sha256sum "$arm64_archive" | awk '{print $1}')"

          echo "sha_amd64=$sha_amd64" >> "$GITHUB_OUTPUT"
          echo "sha_arm64=$sha_arm64" >> "$GITHUB_OUTPUT"

      - name: Clone Homebrew tap
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_NO_V: ${{ steps.version.outputs.version_no_v }}
          SHA_AMD64: ${{ steps.checksums.outputs.sha_amd64 }}
          SHA_ARM64: ${{ steps.checksums.outputs.sha_arm64 }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula

          cat > tap/Formula/tw-mcp.rb <<EOF
          class TwMcp < Formula
            desc "Teamwork.com MCP server"
            homepage "https://github.com/${REPO}"
            version "${VERSION_NO_V}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${REPO}/releases/download/${VERSION}/tw-mcp_${VERSION_NO_V}_darwin_arm64.tar.gz"
                sha256 "${SHA_ARM64}"
              else
                url "https://github.com/${REPO}/releases/download/${VERSION}/tw-mcp_${VERSION_NO_V}_darwin_amd64.tar.gz"
                sha256 "${SHA_AMD64}"
              end
            end

            def install
              bin.install "tw-mcp"
            end

            test do
              assert_match "Usage", shell_output("#{bin}/tw-mcp -h", 2)
            end
          end
          EOF

      - name: Commit and push formula branch
        id: formula-branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No Homebrew formula changes detected"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="chore/homebrew-tw-mcp-${VERSION}"
          git checkout -B "$branch"
          git add Formula/tw-mcp.rb
          git commit -m "tw-mcp ${VERSION}"
          git push --force-with-lease origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.formula-branch.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ steps.formula-branch.outputs.branch }}
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "$BRANCH" --base "$BASE_REF" --state open --json number --jq '.[0].number')"
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr already exists for $BRANCH"
            exit 0
          fi

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "$BASE_REF" \
            --head "$BRANCH" \
            --title "chore: update Homebrew formula for ${VERSION}" \
            --body "Automated Homebrew formula update for ${VERSION}."
